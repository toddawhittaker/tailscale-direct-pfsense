# Continuous integration for tailscale-direct-pfsense.
#
# The suite is shell-native and side-effect safe: it fakes tailscale, service,
# logger, curl, date, jot, and netstat on a temporary PATH, so nothing here
# touches a real router, restarts a real service, or needs Tailscale.
#
# Two test jobs run deliberately:
#
#   ubuntu  - fast feedback, and catches ordinary regressions.
#   freebsd - the job that actually reflects the target.  This project runs on
#             pfSense and depends on BSD behavior that simply is not present on
#             a Linux runner: stat -f '%Su' / '%Lp', jot, netstat -ibn, and
#             FreeBSD /bin/sh itself.  GNU stat -f means *filesystem* status,
#             so config_is_safe_to_source cannot be meaningfully exercised on
#             Ubuntu at all.  A green Ubuntu build is not evidence the code
#             works on the router.
#
# Third-party actions are pinned to commit SHAs rather than mutable tags, so a
# retagged upstream release cannot silently change what runs here.  Dependabot
# proposes SHA bumps as reviewable pull requests.
#
# The pull_request trigger is deliberate: these jobs check out and execute
# PR-authored shell, so pull_request_target -- which would run that code with a
# writable token and access to secrets -- would be unsafe.  No job needs
# secrets, permissions are read-only, and the checkout token is not persisted
# into .git/config.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.  FreeBSD VM
# boots are the slowest thing here, so cancelling saves real time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax checks
        run: make smoke

      - name: Test suite
        run: make test

  freebsd:
    name: Tests (FreeBSD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Boots a FreeBSD VM on the Ubuntu runner and runs the steps inside it.
      # GitHub provides no native FreeBSD runner; this is the established way
      # to test BSD behavior on Actions.
      #
      # release is pinned to 14.0 to match the FreeBSD base of pfSense CE 2.7,
      # the supported target (see README "Requirements" and
      # docs/architecture.md).  Fidelity to the target matters more here than
      # currency: the whole reason this job exists is that stat -f, jot, and
      # netstat -ibn behavior is what can drift between FreeBSD releases, so
      # testing against a newer 14.x than the router actually runs would
      # weaken the signal.  Bump this when the supported pfSense base moves.
      #
      # Keep the release fully qualified.  The action reads a partial value
      # such as "14" as a prefix and boots the newest release matching it,
      # which would drift the VM off the router's base without failing.
      #
      # What makes the suite run under the VM's /bin/sh is the Makefile, which
      # invokes each test as `sh <script>`, not anything set here.  The usesh
      # input chose the shell for this block only, and v1.5.4 deprecated and
      # ignores it, so passing it is dropped rather than left reading like it
      # still decides something.
      - name: Run suite in a FreeBSD VM
        uses: vmactions/freebsd-vm@d0518f912576ae759075aa00fb9fe27037940271 # v1
        with:
          release: "14.0"
          run: |
            set -e
            make smoke
            make test

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job was advisory until its baseline reached zero.  It is now a
    # blocking check, which is only defensible because two things are true
    # together: the exclusion list below is curated rather than blanket, and
    # the shellcheck version is pinned, so the baseline cannot move without an
    # explicit change to this file.
    #
    # AGENTS.md remains right that shellcheck is not authoritative for
    # pfSense/FreeBSD.  Blocking on it does not change that.  A new finding
    # here means "look at this", not "shellcheck is correct" -- and the right
    # resolution is sometimes an inline `# shellcheck disable=` with a comment
    # explaining why the code is right, as in the rc.d wrapper's start path.
    # Scope such a disable as narrowly as the code allows: a line-level
    # suppression also covers anything added to that line later, which is how
    # a real finding goes silently unreported under a blocking job.
    #
    # The exclusions below are not cosmetic -- each one suppresses a check that
    # is actively wrong for this codebase:
    #
    #   SC1007  misreads `CDPATH= cd -- ...` as a typo'd assignment.  That
    #           idiom is the correct POSIX way to neutralize CDPATH before cd,
    #           and every test script opens with it.
    #   SC2034  "appears unused" for variables consumed by a caller rather than
    #           locally: rcvar, start_cmd, stop_cmd, restart_cmd, status_cmd
    #           are all read by rc.subr's run_rc_command at runtime.
    #   SC1091  cannot follow `. /etc/rc.subr`, which does not exist at lint
    #           time on a Linux runner.
    #   SC1090  cannot follow a sourced path held in a variable.  Every test
    #           does `. "${REPO_ROOT}/tailscale_watchdogd"`, which is the whole
    #           mechanism the suite is built on.
    #   SC2016  "expressions don't expand in single quotes".  This was the
    #           single largest group in the baseline, and non-expansion is the
    #           entire point everywhere it fires: fake commands are written as
    #           <<'EOF' heredocs precisely so that $1 and $* reach the fake
    #           script rather than being expanded by the test writing it, and
    #           test_docs_static.sh asserts on literal strings such as
    #           'docs=${DOCS_URL}' that must not expand.
    #   SC2223  flags `: ${var:="default"}` as a globbing hazard.  That is the
    #           standard rc.d idiom for defaulting rc.conf variables and is
    #           used as intended in the wrapper.
    #
    # Deliberately NOT excluded, so they stay visible as real signal: SC2015
    # (A && B || C), SC2181 (checking $? instead of the command directly), and
    # SC2086 (unquoted expansion -- which is correct for rc.d flags but worth
    # seeing anywhere else).
    #
    # tailscale_watchdog.conf.example is deliberately absent from the file
    # list: it is sourced, never executed, so shellcheck demands a shebang it
    # must not have and flags every setting as unused.  tests/smoke.sh already
    # syntax-checks it with `sh -n`, which is the right tool for a config file.
    #
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than installed from apt.  The runner image's shellcheck
      # version is not under this repository's control, and the baseline is
      # version-sensitive: SC2015 fires on 0.9.0 but was dropped in later
      # releases for the `A && B || true` shape used in uninstall.sh.  With an
      # apt install, a runner image refresh could turn this job red without a
      # single line of project code changing -- which matters now that the
      # baseline is clean and the job is a candidate for becoming required.
      #
      # The checksum is verified because this downloads a third-party binary
      # and runs it.  Unlike install.sh, where a checksum committed beside the
      # payload would add nothing, here it pins an artifact published by
      # someone else, so it is a real integrity check.
      #
      # MAINTENANCE: this pin does not update itself.  Dependabot's
      # github-actions ecosystem tracks `uses:` action SHAs, not a version
      # string inside a `run:` block, so it will never propose a shellcheck
      # bump.  To move versions, change both SHELLCHECK_VERSION and
      # SHELLCHECK_SHA256 together -- the checksum is for the .tar.xz asset of
      # the matching release -- and expect the baseline to shift, since
      # findings appear and disappear across shellcheck releases.  SC2015 in
      # uninstall.sh is the worked example: it fired on 0.9.0 and does not on
      # 0.11.0.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -eu
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 \
            "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint as POSIX sh
        run: |
          shellcheck --shell=sh -e SC1007,SC1090,SC1091,SC2016,SC2034,SC2223 \
            tailscale_watchdogd \
            tailscale_watchdog \
            install.sh \
            uninstall.sh \
            tests/*.sh \
            tests/lib/testlib.sh
