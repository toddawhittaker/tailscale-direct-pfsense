# Continuous integration for tailscale-direct-pfsense.
#
# The suite is shell-native and side-effect safe: it fakes tailscale, service,
# logger, curl, date, jot, and netstat on a temporary PATH, so nothing here
# touches a real router, restarts a real service, or needs Tailscale.
#
# Two test jobs run deliberately:
#
#   ubuntu  - fast feedback, and catches ordinary regressions.
#   freebsd - the job that actually reflects the target.  This project runs on
#             pfSense and depends on BSD behavior that simply is not present on
#             a Linux runner: stat -f '%Su' / '%Lp', jot, netstat -ibn, and
#             FreeBSD /bin/sh itself.  GNU stat -f means *filesystem* status,
#             so config_is_safe_to_source cannot be meaningfully exercised on
#             Ubuntu at all.  A green Ubuntu build is not evidence the code
#             works on the router.
#
# Third-party actions are pinned to commit SHAs rather than mutable tags, so a
# retagged upstream release cannot silently change what runs here.  Dependabot
# proposes SHA bumps as reviewable pull requests.
#
# The pull_request trigger is deliberate: these jobs check out and execute
# PR-authored shell, so pull_request_target -- which would run that code with a
# writable token and access to secrets -- would be unsafe.  No job needs
# secrets, permissions are read-only, and the checkout token is not persisted
# into .git/config.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.  FreeBSD VM
# boots are the slowest thing here, so cancelling saves real time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Syntax checks
        run: make smoke

      - name: Test suite
        run: make test

  freebsd:
    name: Tests (FreeBSD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Boots a FreeBSD VM on the Ubuntu runner and runs the steps inside it.
      # GitHub provides no native FreeBSD runner; this is the established way
      # to test BSD behavior on Actions.
      #
      # release is pinned to 14.0 to match the FreeBSD base of pfSense CE 2.7,
      # the supported target (see README "Requirements" and
      # docs/architecture.md).  Fidelity to the target matters more here than
      # currency: the whole reason this job exists is that stat -f, jot, and
      # netstat -ibn behavior is what can drift between FreeBSD releases, so
      # testing against a newer 14.x than the router actually runs would
      # weaken the signal.  Bump this when the supported pfSense base moves.
      #
      # usesh runs the block under /bin/sh rather than the VM's default shell.
      - name: Run suite in a FreeBSD VM
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1
        with:
          release: "14.0"
          usesh: true
          run: |
            set -e
            make smoke
            make test

  shellcheck:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory on purpose.  AGENTS.md is explicit that shellcheck is not
    # authoritative for pfSense/FreeBSD.
    #
    # The exclusions below are not cosmetic -- each one suppresses a check that
    # is actively wrong for this codebase:
    #
    #   SC1007  misreads `CDPATH= cd -- ...` as a typo'd assignment.  That
    #           idiom is the correct POSIX way to neutralize CDPATH before cd,
    #           and every test script opens with it.
    #   SC2034  "appears unused" for variables consumed by a caller rather than
    #           locally: rcvar, start_cmd, stop_cmd, restart_cmd, status_cmd
    #           are all read by rc.subr's run_rc_command at runtime.
    #   SC1091  cannot follow `. /etc/rc.subr`, which does not exist at lint
    #           time on a Linux runner.
    #
    # tailscale_watchdog.conf.example is deliberately absent from the file
    # list: it is sourced, never executed, so shellcheck demands a shebang it
    # must not have and flags every setting as unused.  tests/smoke.sh already
    # syntax-checks it with `sh -n`, which is the right tool for a config file.
    #
    # Drop continue-on-error once the remaining baseline is clean or fully
    # curated, so the job becomes required.  An advisory check nobody reads is
    # worth nothing.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint as POSIX sh
        run: |
          shellcheck --shell=sh -e SC1007,SC2034,SC1091 \
            tailscale_watchdogd \
            tailscale_watchdog \
            install.sh \
            uninstall.sh \
            tests/*.sh \
            tests/lib/testlib.sh
